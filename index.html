
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MANSHOFAH-EY Store</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- LOGIN -->
<div id="loginPage" class="auth-page">
    <div class="auth-box">
        <h2>MANSHOFAH-EY</h2>
        <p>Login to your account</p>

        <input id="username" placeholder="Username">
        <input id="password" type="password" placeholder="Password">

        <button onclick="login()">Login</button>

        <p id="loginMessage"></p>
        <p>Don't have an account?
            <a href="#" onclick="showRegister()">Register</a>
        </p>
    </div>
</div>

<!-- REGISTER -->
<div id="registerPage" class="auth-page hidden">
    <div class="auth-box">
        <h2>Create Account</h2>

        <input id="regUsername" placeholder="Username">
        <input id="regPassword" type="password" placeholder="Password">
        <input id="confirmPassword" type="password" placeholder="Confirm Password">

        <button onclick="register()">Register</button>

        <p>Already have an account?
            <a href="#" onclick="showLogin()">Login</a>
        </p>
    </div>
</div>

<!-- STORE -->
<div id="storePage" class="hidden">

    <header>
        <h1>MANSHOFAH-EY Store</h1>
        <p>Shop your favorite products!</p>
        <button onclick="logout()">Logout</button>
    </header>

    <main class="container">

        <h2>Available Products</h2>
        <div id="products" class="products"></div>

        <section class="cart">
            <h2>Shopping Cart</h2>
            <div id="cart">Your cart is empty.</div>
            <h3>Total: ₱<span id="total">0</span></h3>
        </section>

        <section class="checkout">
            <h2>Customer Information</h2>

            <input id="customer" placeholder="Enter your name">
            <input id="address" placeholder="Enter your address">

            <button onclick="placeOrder()">Place Order</button>
        </section>

    </main>
</div>

<script src="script.js"></script>
</body>
</html>
